<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visibility 프로퍼티</title>
</head>
<body>
    <h3>다음 빈 곳에 숨은 단어? 
        <button>show/hide</button>
    </h3>
    <hr>
    <ul>
        <li>I (<span>love</span>) you.</li>
        <li>CSS is Cascading (<span>Style</span>) Sheet.</li>
        <li>응답하라 (<span>1988</span>)</li>
    </ul>
    
    <script>
        let button = document.querySelector("button");
        let answers = document.querySelectorAll("span");
        let visible = false;

        for(let answer of answers){
            answer.style.visibility = "hidden";
        }

        button.onclick=function(){
            visible = !visible;

            for(let answer of answers){
                answer.style.visibility = visible ? "visible" : "hidden";
            }
        }
    </script>
</body>
</html>
