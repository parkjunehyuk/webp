<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>텍스트 꾸미기</title>
    <style>
		body {
			background-color: linen;
		}

        p{
           color: brown;
           background-color: skyblue;
        }
		span {
            font-size: 25px;
            text-decoration-line: underline;
		}
	</style>
</head>

<body>
    <h3>텍스트와 폰트</h3>
    <hr>
    <p>AliceBlue 바탕색에 Brown 색<br>
        의 "Lucida Console" 폰트로<br>
        10px 크기이고 <span>저는 이보다<br>
             1.5배 큽니다.</span>
    </p>
</body>

</html>
