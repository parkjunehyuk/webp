<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 브라우저</title>
    <style>
        .container {
            display: flex;
            align-items: flex-start;
            gap: 20px; /* 텍스트와 이미지 사이의 간격 */
        }
    </style>
</head>

<body>
    <h3>웹 브라우저 소개</h3>
    <hr>
        
    <div class="container">

    <p>브라우저라고 불리기도 하는<br>
    웹 브라우저(Web Browser)<br>
    는, 사용자에게 웹 서버 컴퓨<br>
    터에 접속하고 웹 페이지, 이<br>
    미지, 동영상, 음악 등 다양한<br>
    데이터 다운받아 보여주는 소<br>
    프트웨어이다. <b>그림 1-2</b>는 대<br>
    표적인 Chrome 웹 브라우저<br>
    를 보여준다
    </p>
        <figure id="1-2">
        <img src="media/chrome.png" alt="Chrome 웹 브라우저" width="250" height="200">
        <figcaption><b>그림 1-2 Chrome 웹 브라우저</b></figcaption>
        </figure>
    </div>
    
    
    <div class="container">
    <p>
        웹 페이지는 브라우저에<br>
        HTML5 문서임을 알리기 위<br>
        해 그림 1-3과 같은 코드를<br>
        첫 라인에 삽입하여야 한다.
    </p>
    <figure id="1-3">
        <code>&lt;!DOCTYPE html&gt;</code><br>
        <code>&lt;/html&gt;</code><br>
        <code>...</code><br>
        <code>&lt;/html&gt;</code>
    
        <figcaption><b>그림 1-3 HTML5 문서 구성</b></figcaption>
    </figure>
</body>

</html>
