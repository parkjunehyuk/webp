<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소프트웨어 기술 선호에 관한 설문 -Ch</title>
    <style>
        /* 항목 간격 넓히기 */
        .form-group {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <h1>설문지</h1>
    <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
    <hr>
    <form>
        
        <div class="form-group">
        학년
        <input type="radio" name="학년" value="1" checked>1학년
        <input type="radio" name="학년" value="2">2학년
        <input type="radio" name="학년" value="3">3학년
        <input type="radio" name="학년" value="4">4학년<br>
        </div>

        <div class="form-group">
            성별
            <input type="radio" name="성별" value="1">남
            <input type="radio" name="성별" value="1">여<br>
        </div>

        <div class="form-group">
        관심분야
        <select name="관심분야">
            <option value="1" selected>모바일 소프트웨어</option>
            <option value="2">웹 소프트웨어</option>
            <option value="3">정보통신 소프트웨어</option><br>
        </select>
        </div>

        <div class="form-group">
        진로
        <input type="checkbox" value="1" checked>개발
        <input type="checkbox" value="2">기획
        <input type="checkbox" value="3">영업
        <input type="checkbox" value="4"> 창업<br>
        </div>

        <div class="form-group">
        남기고 싶은 말<br>
        <textarea placeholder="글을 남겨주세요" rows="7" cols="40"></textarea><br>
        </div>

        <p>Copyright 2022 by Kitae</p>


    </form>
</body>

</html>
