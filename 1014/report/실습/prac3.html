<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>방문시간에 따라 바뀌는 배경</title>
  </head>
  <body>
    <h3>오전이면 lightskyblue, 오후이면 orange 배경</h3>
    <hr />
    <script>
      let d = new Date();
      let time = d.getHours();
      let minute = d.getMinutes();
      let second = d.getSeconds();
      document.write(
        "현재 시간 : " + time + "시," + minute + "분," + second + "초,",
      );

      if (time < 12) document.body.style.backgroundColor = "lightskyblue";
      else document.body.style.backgroundColor = "orange";
    </script>
  </body>
</html>
