<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>book 객체 만들기</title>
  </head>
  <body>
    <h3>book 객체 만들기</h3>
    <hr />
    <script>
      size = 5;
      books = new Array(size);
      for (let i = 0; i < size; i++) {
        let p = prompt("콤마(,)로 분리하면서 책제목 저자 가격 순으로 입력");
        let pArr = p.split(",");

        let book = new Object();
        book.title = pArr[0];
        book.author = pArr[1];
        book.price = pArr[2];

        books[i] = book;
      }

      let expensiveBook = books[0];
      for (let i = 0; i < books.length; i++) {
        document.write(
          books[i].title +
            ", " +
            books[i].author +
            ", " +
            books[i].price +
            "<br>",
        );
        expensiveBook =
          books[i].price > expensiveBook.price ? books[i] : expensiveBook;
      }

      document.write("<hr>");
      document.write("가장 가격이 비싼 책은 " + expensiveBook.title);
    </script>
  </body>
</html>
