<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>문자열 분할</title>
  </head>
  <body>
    <h3>문자열 분할</h3>
    <hr />
    <script>
      inputString = prompt(
        "문자열 입력",
        "qeury=java&id=5&who=kitae&target=_blank",
      );
      splitArr = inputString.split("&");
      for (let i = 0; i < splitArr.length; i++) {
        document.write(splitArr[i] + "<br>");
      }
    </script>
  </body>
</html>
