<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>select 객체에서 선택한 과일출력</title>
    <script>
        function drawImage() {
            let sel = document.getElementById("fruits");
            let img = document.getElementById("fruitimage");
            img.src = sel.options[sel.selectedIndex].value;
        }
    </script>
</head>

<body onload="drawImage()">
    <h3>select 객체에서 선택한 과일 출력</h3>
    <hr>
    과일을 선택하면 이미지가 출력됩니다.<p>
    <form>
        <select id="fruits" onchange="drawImage()">
            <option value="Attached_File/strawberry.jpeg">딸기
            <option value="Attached_File/banana.jpeg" selected>바나나
            <option value="Attached_File/apple.jpeg">사과
        </select>
        <img id="fruitimage" src="Attached_File/strawberry.jpeg" alt="">
    </form>
</body>

</html>
