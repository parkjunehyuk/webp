<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>라디오 버튼과 이미지 출력</title>
</head>

<body>
  <h3>라디오 버튼을 클릭하면 이미지를 출력합니다.</h3>
  <form>
    <input type="radio" name="과일" id="banana" />바나나
    <input type="radio" name="과일" id="mango" />망고
    <input type="radio" name="과일" id="apple" />사과
  </form>
  <img src="" alt="" id="img" />
  <script>
    let img = document.getElementById("img");
    let fruits = document.getElementsByName("과일");

    for (let fruit of fruits) {
      fruit.addEventListener("click", function () {
        img.src = "media/"+ fruit.id + ".png";
      });
    }
  </script>
</body>

</html>
