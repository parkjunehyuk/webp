<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>onwheel</title>
</head>

<body>
  <h3>마우스 휠을 이용한 이미지 확대/축소</h3>
  <hr />
  <p>
    이미지 위에 휠을 위로 굴리면 이미지가 축소되고 아래로 굴리면 이미지가
    확대됩니다.
  </p>
  <img src="char_2025_shu_nlc_1.png" alt="shu" id="img" />
  <script>
    let img = document.getElementById("img");
    img.onwheel = function (e) {
      if (e.wheelDelta < 0) {
        img.width = img.width / 1.05;
      } else {
        img.width = img.width * 1.05;
      }
    };
  </script>
</body>

</html>
