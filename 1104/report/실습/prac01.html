<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>onblur와 onfocus</title>

  <script>
    window.onblur = function (e) { //웹 브라우저 창 전체가 포커스 잃었을때
      console.log(e); // 이벤트 객체 전체를 콘솔에 출력
      console.log(e.type); // "blur" 출력 (어떤 이벤트가 발생했는지 알려줌)
      document.body.style.backgroundColor = "lightgray";
      
    };

    window.onfocus = function (e) {  //포커스 얻었을때
      document.body.style.backgroundColor = "white";
    };
  </script>

</head>

<body>
  <h3>포커스와 onblur,onfocus</h3>
  <hr>
  <p>
    브라우저 바깥에 마우스를 클릭하면 window 객체에 blur 이벤트가 발생하고
    다시 마우스를 클릭하면 window 객체에 focus 이벤트가 발생한다.
  </p>
  
</body>

</html>
