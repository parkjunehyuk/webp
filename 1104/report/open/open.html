        let imgs = document.images;
        let randomIdx = Math.floor(Math.random() * imgs.length);
        imgs[randomIdx].src = "media/apple.png";
        for (let i = 0; i < imgs.length; i++) {
            imgs[i].addEventListener("click", f);
        }
        function f() {
            if (this.src == "") return;

            this.src = "";
            let randomIdx = Math.floor(Math.random() * imgs.length);
            imgs[randomIdx].src = "media/apple.png";
