<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>1</title>
    <script>
        function big(a, b) {
            if (a > b) 
                return a;
            else if(a < b) 
                return b;
        }
    </script>
</head>

<body>
    <script>
        let b = big("625", "555");
        document.write("큰수=" + b);
    </script>
</body>

</html>
